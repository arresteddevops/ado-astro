name: Nicole Forsgren
snapshots:
  - key: nforsgren
    bio: Nicole Forsgren is an IT impacts expert who shows leaders how to unlock the potential of technological change in their organizations. Best known for her work with tech professionals and as the lead investigator on the State of DevOps study, she is a consultant, expert, and researcher in knowledge management, IT adoption and impacts, and DevOps. She is the Director of Organizational Performance and Analytics at Chef and an Academic Partner at the Social Analytics Institute at Clemson University. In a previous life, she was a professor, researcher, and hardware performance analyst. She holds a PhD in Management Information Systems and a Masters in Accounting. She has consulted and advised Fortune 50 Companies, startups and government agencies, and has been awarded public and private research grants (funders include NASA and the NSF). Her work has been featured in various media outlets, including the Wall Street Journal, Forbes, and InfoWeek.
    thumbnail: img/guests/nforsgren.png
    website: http://nicoleforsgren.com
    twitter: nicolefv
    linkedin: https://www.linkedin.com/in/nicolefv
  - key: nforsgren2
    bio: Dr Nicole Forsgren is an IT impacts expert who is best known for her work with tech professionals and as the lead investigator on the largest DevOps studies to date. She is a consultant, expert, and researcher in knowledge management, IT adoption and impacts, and DevOps. In a previous life, she was a professor, sysadmin, and hardware performance analyst. She has been awarded public and private research grants (funders include NASA and the NSF), and her work has been featured in various media outlets and several peer-reviewed journals and conferences. She holds a PhD in Management Information Systems and a Masters in Accounting. Dr. Forsgren is the CEO and chief scientist at DevOps Research and Assessment (DORA).
    thumbnail: img/guests/nforsgren2.png
    website: http://nicoleforsgren.com
    twitter: nicolefv
    linkedin: https://www.linkedin.com/in/nicolefv
  - key: nforsgren3
    bio: "Dr. Nicole Forsgren does research and strategy at Google Cloud following the acquisition of her startup DevOps Research and Assessment (DORA) [by Google](https://devops-research.com/2018/12/dora-joins-google-cloud/). She is co-author of the book [Accelerate: The Science of Lean Software and DevOps](https://www.amazon.com/Accelerate-Software-Performing-Technology-Organizations-ebook/dp/B07B9F83WM), and is best known for her work measuring the technology process and as the lead investigator on the largest DevOps studies to date. She has been an entrepreneur, professor, sysadmin, and performance engineer. Nicole’s work has been published in several peer-reviewed journals. Nicole earned her PhD in Management Information Systems from the University of Arizona, and is a Research Affiliate at Clemson University and Florida International University."
    thumbnail: img/guests/nforsgren3.png
    website: http://nicoleforsgren.com
    twitter: nicolefv
    linkedin: https://www.linkedin.com/in/nicolefv
