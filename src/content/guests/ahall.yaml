name: Alena Hall
snapshots:
  - key: ahall
    bio: Alena Hall is a Senior Cloud Developer Advocate at Microsoft. She previously worked on a security fuzzing project at Microsoft Research. Alena has more than ten years of experience in the software engineering industry with a focus on distributed cloud programming, real-time system modeling, high load and performance, big data analysis, data science, functional programming, and machine learning. She is an elected member of the F# Software Foundation’s board of trustees. You can find her on Twitter as @lenadroid.
    thumbnail: img/guests/ahall.png
    twitter: lenadroid
