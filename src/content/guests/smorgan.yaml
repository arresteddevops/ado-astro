name: Sarah Morgan
snapshots:
  - key: smorgan
    bio: Sarah is a seasoned professional in the software industry with more years of experience than she's willing to admit. She has worked at both large enterprise companies and scrappy startups, honing her skills in product management. Currently, Sarah is a Sr. Product Manager at TelemetryHub. With a BS in Computer Science from Eckerd College, a Master of Science in Innovation from Northeastern University, and an MBA from the same institution, she brings a wealth of knowledge and expertise to her role. Sarah is passionate about building successful products and solving challenging customer problems creatively and elegantly. Her extensive background in the industry makes her a valuable asset to any team.
