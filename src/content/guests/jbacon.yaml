name: Jono Bacon
snapshots:
  - key: jbacon
    bio: Jono Bacon is a leading community strategist, speaker, author, and podcaster. He is the founder of Jono Bacon Consulting which provides community strategy/execution, workflow, and other services. He previously served as director of community at GitHub, Canonical, XPRIZE, and OpenAdvantage. His clients include Huawei, GitLab, Microsoft, Intel, Google, Sony Mobile, Deutsche Bank, Santander, HackerOne, Mattermost, SAP, FINOS Foundation, The Executive Center, data.world, Creative Commons, and others. He is the author of the critically-acclaimed The Art of Community, a columnist for Forbes and opensource.com, founder of the Community Leadership Summit and Open Collaboration Conferences, and co-founder of Bad Voltage. He is an advisor to AlienVault, Moltin, data.world, Mycroft, Open Networking Foundation, and Open Cloud Consortium.
