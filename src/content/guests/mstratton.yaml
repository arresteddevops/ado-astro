  - key: mstratton2
    bio: Matty Stratton is a customer architect at Chef, where he demonstrates how Chef's automation platform provides speed and flexibility to clients' infrastructure. He is devoted to concepts like Continuous Delivery and Infrastructure as Code, and his license plate actually says "DevOps". He lives in the Chicagoland area with his wife Andrea, and his three kids, Henry, Joey, and Sophia. He also has an unhealthy obsession with *Doctor Who*, *Firefly*, and *Game of Thrones*. And whiskey.
    thumbnail: img/guests/mstratton2.png
