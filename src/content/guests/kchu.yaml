  - key: kchu
    bio: Karen Chu is a Community PM on the Microsoft Azure Container Compute Upstream team with a focus on open source tools such as Helm, CNAB, Brigade, Virtual Kubelet, and more. She is a CNCF Ambassador, meet-up organizer, and conference organizer. She has also worked on and keynoted on The Illustrated Children’s Guide to Kubernetes book series. When she’s not connecting dots in the community, you can find her traveling, pursuing photography, and enjoying awesome chai.
