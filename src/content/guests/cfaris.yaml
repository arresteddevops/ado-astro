name: Cassandra Faris
snapshots:
  - key: cfaris
    bio: Cassandra Faris is passionate about the human side of technology. She is the Community Manager for Kasten by Veeam, a Kubernetes data management platform. Her career has focused on supporting tech professionals through training, community outreach, open source, marketing, hiring, mentoring, and employee engagement. She is an international speaker who specializes in teaching people how to communicate, be more inclusive team members, advance their careers, and take care of their mental health.  She is President of the Stir Scholarship for women pursuing technology degrees. She has an MBA in Organizational Leadership. When she's not busy with the tech community, she is an avid tabletop gamer, corgi mom, and soccer fan who travels as much as possible.
