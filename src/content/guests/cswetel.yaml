name: Cat Swetel
snapshots:
  - key: cswetel
    bio: Cat is a technology leader interested in exploring how digital transformation facilitates relationships and could create conditions for more generative institutions. Her leadership style is deeply feminist in that it is focused on allowing all people to flourish. This leadership style (coupled with good technology instincts) has allowed Cat to establish an impressive track record of delivering the “impossible”. In addition to leadership experience in a variety of settings from startups to large enterprises, Cat is also an accomplished public speaker delivering keynotes, workshops, etc all around the world. In her leisure time, Cat enjoys cooking, hiking, making jokes about Bitcoin, and reading feminist literature.
