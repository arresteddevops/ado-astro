name: Pete Cheslock
snapshots:
  - key: pcheslock
    bio: Pete is currently the head of Operations and Support for Threat Stack, a continuous security monitoring company. Pete is a 15 year veteran of the technology industry and sees Threat Stack solving a critical problem around continuous security monitoring with dynamic, cloud based infrastructure. Previously, he built out the automation and release engineering teams at Dyn, managing and deploying mission critical global DNS infrastructure. Prior to Dyn, Pete was the Director of Technical Operations for Amazon-Backed cloud archiving company Sonian, where he developed and managed a Petabyte scale archiving application across multiple public clouds.
    thumbnail: img/guests/pcheslock.png
    website: http://pete.io/
    twitter: petecheslock
    linkedin: http://linkedin.com/in/petecheslock
  - key: pcheslock2
    bio: As the head of Threat Stack’s operations and support teams, Pete Cheslock is focused on delivering the highest level of service, reliability, and customer satisfaction to Threat Stack’s growing user base. An industry veteran with over 15 years’ experience in operations, Pete understands the challenges and issues faced by security, development, and operations professionals every day, and how they can help. Prior to Threat Stack, Pete held senior positions at Dyn and Sonian, where he built, managed, and developed automation and release engineering teams and projects.
    thumbnail: img/guests/pcheslock2.png
    website: http://pete.wtf/
    twitter: petecheslock
    linkedin: http://linkedin.com/in/petecheslock
  - key: pcheslock3
    bio: Pete is a recovering system administrator who got his start with AWS services back in 2009 while at Sonian, the first cloud based email archiving platform. Pete is now a Cloud Economist at [the Duckbill Group](https://www.duckbillgroup.com/) where he spends his time obsessing over customers' AWS bills so they don't have to. A frequent speaker at DevOps and Observability events, Pete brings a product mindset to SaaS operations. While not trimming AWS bills, he spends his free time smoking meats and tweeting about the results.
    thumbnail: img/guests/pcheslock3.png
    website: https://pete.wtf
    twitter: petecheslock
  - key: pcheslock4
    bio: |-
      Pete is currently the Head of Growth And Community for AppMap, the open source dynamic runtime code analyzer. Pete also works with early stage startups, helping them navigate the complex world of early stage new product development.

      Pete also fully acknowledges his profile pic is slightly out of date, but has been too lazy to update it to reflect current hair growth trends.
    thumbnail: img/guests/pcheslock3.png
    website: https://pete.wtf
    twitter: petecheslock
    github: petecheslock
    linkedin: petecheslock
    pronouns: He/Him
