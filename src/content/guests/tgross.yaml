name: Tim Gross
snapshots:
  - key: tgross
    bio: Timothy Gross is a product manager for Joyent, providers of the Triton Elastic Container Service. Tim previously ran Ops at DramaFever, where he and his scrappy team ran Docker in production to serve a few million fans their daily dose of dramas, documentaries, and gross-out horror movies. In a previous life, Tim was an architect (buildings, not software). He took the leap into programming and operations after he discovered he could automate away almost everything boring in his life.
    thumbnail: img/guests/tgross.png
    website: http://0x74696d.com/
    twitter: "0x74696d"
  - key: tgross2
    bio: Tim Gross is a software engineer at HashiCorp, where he works on the Nomad core team. Previously, he’s been a developer, sysadmin, developer advocate, engineering manager, and devops engineer (whatever that is!) at a handful of startups including Joyent and DramaFever. Recently he’s also been coaching engineering teams at startups and fledgling non-profits as an independent consultant. A long time ago in a galaxy far far away Tim used to design buildings instead of software. He mostly worked on safety-sensitive projects like biosafety labs, pharma manufacturing, hazmat, and even bomb-proofing a few times. Which turn out to be shockingly transferable skills for diving into a typical code base.
    thumbnail: img/guests/tgross2.png
    website: https://0x74696d.com/
    twitter: "0x74696d"
