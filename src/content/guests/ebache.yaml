    bio: Emily Bache is a Technical coach at ProAgile and also a well known author and speaker. Emily works with software development teams and organisations who want to get better at the technical practices needed to be agile, including Test-Driven Development, Refactoring, Incremental Design and Architecture. Emily’s most recent book *[Technical Agile Coaching with the Samman Method](https://leanpub.com/techagilecoach)* details her coaching methods. Originally from the UK, Emily lives in Gothenburg, Sweden.
