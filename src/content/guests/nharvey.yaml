  - key: nharvey
    bio: VP of Community Development at Chef, helps the community whip up an awesome ecosystem built around the Chef platform. Nathen also spends much of his time helping people learn about the practices, processes, and technologies that support DevOps, continuous delivery, and high velocity organizations.  Nathen is a co-host of the [Food Fight Show](http://foodfightshow.org/), a podcast about Chef and DevOps.  He is also an occasional [farmer](http://ei.chef.io) who loves [eggs](http://eggs.chef.io) and actively supports [#hugops](http://hugops.chef.io).
