    bio: Rob is a Senior Software Engineer on the Windows Team at Puppet Labs, where we make Windows moar awesome! He has a passion for automation and making hard concepts simple. Rob is also the creator and primary maintainer of Chocolatey, a package manager for Windows. His past as an artist has shaped the way he thinks about and develops code. Rob lives in Kansas where he spends time with his wife and two children, cheers on the Royals, and avoids tornadoes.
