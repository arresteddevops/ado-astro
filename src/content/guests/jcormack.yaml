name: Justin Cormack
snapshots:
  - key: jcormack
    bio: Justin Cormack is the CTO for Docker. He has been at Docker since 2015, as a senior engineer in security and as a maintainer of Docker's open source projects. He is a member of the Technical Oversight Committee for the Cloud Native Security Foundation, helping grow projects and community in the cloud native space. He previously has worked in engineering, management and operations in finance and publishing. He is based in Cambridge, UK.
