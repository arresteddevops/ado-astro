name: Rob Cummings
snapshots:
  - key: rcummings
    bio: Rob has been involved in IT operations for the past 14 years. This includes work at Bose, EMC Corporation, and Accenture prior to joining Nordstrom. While at Nordstrom he has been a sysadmin on teams responsible for [shop.nordstrom.com](http://shop.nordstrom.com), back-end merchandising systems, and virtualization infrastructure. Rob made the jump into leadership by helping form the Nordstrom Infrastructure Engineering and Public Cloud teams. Today, Rob supports the eCommerce Technical Operations teams and is focusing his passion on modernizing our technology stack and how we work together.
