    bio: Angelina is a software developer whom has been messing with computers since she was a tot. Angelina works as a software architect in the Center for Computational Genomics and Data Science under the direction of Dr. Elizabeth Worthey within the University of Alabama at Birmingham (UAB) School of Medicine. Outside work, Angelina helps organizing a local tech conference, WeRockIT Conf, and mentors within the community.  Beyond work she freelances as a french horn player, enjoys k-dramas, plays video and board games, and adventures with her kiddos.
