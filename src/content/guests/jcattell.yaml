    bio: Jerry Cattell is the VP of Engineering for LifeQode, a co-founder of ShiftGen, and occasional Senior Site Reliability Engineer for Yardi Systems. In his spare time, Jerry is a co-organizer of the [DevOps Chicago meetup group](http://meetup.com/devops) and [DevOpsDays Chicago](http://devopsdayschi.org). Jerry has over 17 years experience as a developer, sysadmin, DBA, and systems architect.
