name: Annie Hedgpeth
snapshots:
  - key: ahedgpeth
    bio: I'm totally new to technology, and I'm learning all there is to know about security and compliance. I started a blog to teach others about InSpec in hopes of making it more accessible to non-developers. I'm excited about playing a role in removing security as a bottleneck!
    thumbnail: img/guests/ahedgpeth.png
    website: http://www.anniehedgie.com
    twitter: anniehedgie
    github: anniehedgpeth
    linkedin: https://www.linkedin.com/in/annie-hedgpeth-203393112
  - key: ahedgpeth2
    bio: Annie Hedgpeth is a cloud automation engineer at [10th Magnitude](https://www.10thmagnitude.com/), and spends her days using [Chef](https://www.chef.io/) to help move companies to [Azure](https://www.10thmagnitude.com/azure-magnitude-planner). She has written extensively about Chef's security automation tool [InSpec](https://www.inspec.io/) on [her blog](http://www.anniehedgie.com/) in hopes of making the framework more accessible to non-developers. She continues an ongoing interest in DevOpsSec and hopes to play a role in moving security left. She is also excited to be a part of 10th Magnitude's ever-expanding reach in the world of [DevOps](https://www.10thmagnitude.com/solutions/devops-automation-continuous-delivery/) and [Cloud migration](https://www.10thmagnitude.com/solutions/azure-migration-and-data-center-transformation/).
