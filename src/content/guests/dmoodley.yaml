    bio: "Devi has held a wide range of roles in her career: Control & Instrumentation Engineer, Enterprise Architect, Management Consultant, CIO She currently heads up the Enterprise DevOps and Release management practice in Nedbank. This team is responsible for the creation and adoption of the practice of DevOps across the organisation. Devi is a rebel at heart that enjoys challenging tradition and moulding transformation She enjoys cooking, music, karate and the odd run on a Sunday morning."
