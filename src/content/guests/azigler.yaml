    bio: Andrew is a professional developer advocate at Mattermost where he creates resources to empower the open source community. After graduating from The University of Texas at Austin, he taught English abroad in Japan, learned to code between teaching classes, and later became the lead web developer for an e-learning company back home in the United States. A lifelong advocate of career and technical education, Andrew’s passion is helping others unlock their true potential.
