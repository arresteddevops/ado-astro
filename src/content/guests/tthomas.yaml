name: Taylor Thomas
snapshots:
  - key: tthomas
    bio: Taylor Thomas is a Senior Software Engineer at Microsoft Azure working with Helm, as well as other open-source tools. He has been involved with containers and Kubernetes platforms at Intel, Nike, and Microsoft and is one of the core maintainers of Helm. He currently lives in the Utah area and enjoys hiking and camping. He has also talked at multiple conferences, such as KubeCon, Velocity Conference, and Helm Summit about a variety of topics related to containers and Kubernetes.
