name: Dave Strebel
snapshots:
  - key: dstrebel
    bio: Dave Strebel is a Global Open Source Architect on the Microsoft Global Black Belt team. Dave focuses on containers, microservice architecture and the cloud-native ecosystem. Dave has been working in technology for over 15 years and has a mixed background across application development to infrastructure. Dave is based in Minneapolis, MN and in his free time organizes the Minneapolis Cloud Native Meetup and contributes to the Kubernetes Release team. He has also recently co-authored the Kubernetes Best Practice book published by O'Reilly Media.
