      Jacquie Capur is a Senior Developer Advocate at Nebius, where she gets to build cool things with AI. Her work spans cloud and infrastructure, experiments with physical AI and robots, and all the models in between. She’s been building since 2015, working across multicloud platforms, Infrastructure as Code, and compliance-grade environments. A frequent speaker at AWS re:Invent, HashiConf, DevOpsDays, and the Grace Hopper Celebration, Jacquie shares practical, real-world lessons from building, experimenting, and shipping under pressure.
