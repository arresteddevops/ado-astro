name: Stephanie Stimac
snapshots:
  - key: sstimac
    bio: Stephanie is a Design Technologist and Program Manager for Microsoft Edge Developer Experiences. Her design and program management work has been focused on improving the tools developers use to build for the web, including the browser developer tools and the open source project, which she was the lead designer for, [webhint.io](https://webhint.io/).  She is passionate about connecting with the web community to help drive the vision of the future forward and has recently been co-leading [The Web We Want initiative](https://webwewant.fyi) to help do that.
