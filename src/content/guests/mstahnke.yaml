name: Michael Stahnke
snapshots:
  - key: mstahnke
    bio: Michael Stahnke is Director of Engineering at Puppet. He's held a few roles and been a part of the company growing from 35 to 470+ employees. While staying near the domains of release engineering, operations, and community, he’s been in leadership for most of the last decade. His interests are building teams,  mentoring team members, and playing Hot Wheels cars with his son. He came to Puppet Labs from Caterpillar, Inc. where he was an infrastructure architect, infrastructure team lead, and open source evangelist. Michael also helped get the Extra Packages for Enterprise Linux (EPEL) repository launched in 2005, authored of Pro OpenSSH (Apress, 2005), and writes with some frequency about technology and computers. @stahnma on twitter and medium.
    thumbnail: img/guests/mstahnke.png
    website: http://medium.com/@stahnma
    twitter: stahnma
    github: stahnma
    linkedin: https://www.linkedin.com/in/mstahnke
  - key: mstahnke2
    bio: Michael Stahnke is VP of Engineering at Flox. He's been involved with DevOps and DevOpsDays since 2011. He's previous held senior engineering leadership positions at Puppet and CircleCI. He is passionate about simplification and automation of problems both technically and human oriented. He's been a speaker at dozens of conferences and events. He was a founding member of the EPEL package repository and wrote a book OpenSSH in 2005.
    thumbnail: img/guests/mstahnke2.jpg
