name: Bridget Kromhout
snapshots:
  - key: bkromhout
    bio: Bridget Kromhout is an operations engineer at [DramaFever](http://dramafever.com/), the largest streaming video site for international content. She’s been paying the bills with Unix sysadmin work since the last time ‘flannel shirt over babydoll dress’ was a trendy look. Her CS degree emphasis was in theory, but she now deals with the concrete (if ‘cloud’ can be considered tangible). She likes finicky wide-column data stores, stats-driven monitoring, formal grammars, bicycle-powered camping, and butchering pumpkins for home canning. In her spare time she helps organize her local [AWS meetup](http://aws.mn/) and [devopsdays Minneapolis](http://devopsdaysmsp.org/).
    thumbnail: img/guests/bkromhout.png
    website: http://bridgetkromhout.com/
    twitter: bridgetkromhout
  - key: bkromhout3
    bio: Bridget Kromhout is a Principal Technologist for Cloud Foundry at Pivotal. Her CS degree emphasis was in theory, but she now deals with the concrete (if ‘cloud’ can be considered tangible). After 15 years as an operations engineer, she traded being on call for being on a plane. A frequent speaker and program committee member for tech conferences, she leads the devopsdays organization globally and the devops community at home in Minneapolis. She podcasts with Arrested DevOps, blogs at bridgetkromhout.com, and is active in a Twitterverse near you.
    thumbnail: img/guests/bkromhout3.png
    website: http://bridgetkromhout.com/
    twitter: bridgetkromhout
