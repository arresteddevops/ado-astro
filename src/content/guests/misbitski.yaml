    bio: Mike is well-versed in cloud security, container security, Kubernetes security, API security, security testing, mobile security, application protection, and secure continuous delivery. He's guided countless organizations globally in their security initiatives, researching and advising on cybersecurity as a Gartner analyst. Prior to his advisory experience, Mike learned many hard lessons on the front lines of IT with over twenty years of practitioner and leadership experience with application security, vulnerability management, enterprise architecture, and systems engineering at organizations such as Johnson & Johnson, PSEG, and Verizon.
