    bio: Aaron Aldrich is a Managed OpenShift Black Belt at Red Hat, creator of [Tabletop DevOps](https://crayzeigh.com/tabletop-devops/), founding organizer of DevOpsDays Hartford, and frequent DevOpsDays organizer and participant all over. When not talking about DevOps and Resilience Engineering, you can find him talking about Mental Health with osmihelp.org or running Emotional Intelligence workshops with [EmotionalAPI.com](https://emotionalapi.com/). Find him on twitter @crayzeigh for general nonsense and tomfoolery.
