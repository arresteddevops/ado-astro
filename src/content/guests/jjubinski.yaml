name: Jill Jubinski
snapshots:
  - key: jjubinski
    bio: I've been in the tech recruiting game for about 4 years. I got my start recruiting linux sys admins at Rackspace and started slowly creeping up the chain to Linux Sys Engineers (the DevOps of RAX) and Developers. 4 months ago I made a huge move to DigitalOcean to build their recruiting department from the ground up. So I get to run things however I want, muahahhahaha. I like twitter, A LOT, and my dog Noodle. :-)
    thumbnail: img/guests/jjubinski.png
    twitter: jilljubs
  - key: jjubinski2
    bio: Jill Jubinski is a recruiting veteran with over 6 years of recruiting experience in the community. She received her Masters in Industrial/Organizational Psychology with plans to change the way organizations treated their employees. When that didn’t work out she started recruiting ;-) Jill leans on her strength in relationship building as a jumping off point to help organizations build amazing teams and genuinely cares about the health and wellness of an organization’s culture. She is also known to chat incessantly about her dogs and give hugs like they are going out of style.
    thumbnail: img/guests/jjubinski2.png
    twitter: jilljubs
  - key: jjubinski3
    bio: Jill Jubinski is a spirited Recruiting Leader with over 7 years experience in the technical recruiting field. She received her Masters in Industrial/Organizational Psychology with plans to change the way organizations treated their employees. When that didn’t work out she started recruiting :wink:. Jill's main priorities in her work are the humans she interacts with and the relationships being built. She strongly believes that recruiters are a strategic/impactful arm to any organization and that the work they do matters. Jill is also known to chat incessantly about her dogs, give hugs like they are going out of style and feels lucky to work at a company (Fastly) where she can be based in her hometown of St. Louis, MO.
    thumbnail: img/guests/jjubinski3.png
    twitter: jilljubs
