name: Jeff Smith
snapshots:
  - key: jsmith
    bio: Jeff Smith has been in the technology field for over 15 years, oscillating between manager and individual contributor. He currently serves as the Manager of Production Operations at Centro and previously served as the Manager of Site Reliability Engineering at Grubhub. Jeff enjoys discussing the psychological aspect of problems in organizations. Jeff is also one of the co-founders of the [Chicago Nerd Social Club](http://www.chicagonerds.com/). He occasionally musters up the strength to write on his [All Things Dork](http://www.allthingsdork.com) blog.
    thumbnail: img/guests/jsmith.png
