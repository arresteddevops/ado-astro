name: Daniel Deogun
snapshots:
  - key: ddeogun
    bio: Dan Bergh Johnsson, Daniel Deogun, and Daniel Sawano are authors of the book Secure by Design and have collectively been working with security and development for several decades. They are developers at heart and understand that security is often a side-concern. They've also evolved work habits that enable them to develop systems in a way that promotes security while focusing on high-quality design habits – something that's easier for developers to keep in mind during their daily work. All are established international speakers and often present at conferences on topics regarding high-quality development and security.
