title = "ado-astro gitleaks config"

# Extend gitleaks' default ruleset (AWS/GCP/generic high-entropy/etc.) with
# no site-specific rules — this is a static content site with no vendor
# credentials of its own to special-case.
[extend]
useDefault = true

[allowlist]
# src/content/ is migrated legacy public content (episodes, guest/host bios,
# sponsors) generated by scripts/migrate-content.mjs from the public
# ado-hugo repo — no real secret can live there. Confirmed false positives:
# default rules linkedin-client-id / linkedin-client-secret pattern-match
# personal `linkedin:` username fields (e.g. "aaronblohowiak") as if they
# were OAuth credentials.
paths = ['''src/content/.*''']
